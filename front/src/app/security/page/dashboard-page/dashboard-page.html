<section class="home">
  <div class="home__left">
    @if (user(); as u) {
      <h1 class="title">Bienvenue {{ u.username }}.</h1>
      <p>Connecté avec {{ u.mail }}. Gere tes parkings depuis cette interface.</p>
      <div class="home__button">
        <a routerLink="/parking" class="btn">VOIR LES PARKINGS</a>
      </div>
    } @else {
      <p>Chargement...</p>
    }
  </div>
</section>
