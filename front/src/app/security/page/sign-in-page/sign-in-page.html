<section>
  <h1>Connexion</h1>
  <div class="input-box">
    <input type="text" placeholder="Nom utilisateur" name="username" [(ngModel)]="username">
    <i class="fa-solid fa-user"></i>
  </div>
  <div class="input-box">
    <input type="password" placeholder="Mot de passe" name="password" [(ngModel)]="password">
    <i class="fa-solid fa-lock"></i>
  </div>
  <div class="remember-forgot">
    <label><input type="checkbox"> Se souvenir de moi</label>
    <a href="">Mot de passe oublié ?</a>
  </div>
  <button class="login-btn" (click)="signIn()">Se connecter</button>

  @if (error()) {
    <p style="color:#ff6b6b;text-align:center;margin-top:10px">{{ error() }}</p>
  }

  <div class="register-link">
    <p>Pas de compte ? <a routerLink="/sign-up">Inscription</a></p>
  </div>
</section>
