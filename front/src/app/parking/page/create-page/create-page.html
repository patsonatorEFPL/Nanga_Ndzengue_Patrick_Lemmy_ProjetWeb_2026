<h2>Nouveau parking</h2>

<p>Nom : <input [(ngModel)]="nom" name="nom"></p>
<p>Adresse : <input [(ngModel)]="adresse" name="adresse"></p>
<p>Capacite : <input type="number" [(ngModel)]="capacite" name="capacite"></p>
<p>Tarif : <input type="number" [(ngModel)]="tarif_horaire" name="tarif"></p>

<div class="actions">
  <button (click)="create()">creer</button>
  <a routerLink="/parking">retour</a>
</div>
