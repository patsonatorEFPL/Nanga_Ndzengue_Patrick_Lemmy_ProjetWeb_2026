services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cb_api
      POSTGRES_PASSWORD: cb_api
      POSTGRES_DB: cb_api
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb_api"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --silent && npm run start:dev"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: cb_api
      DB_PASSWORD: cb_api
      DB_DATABASE: cb_api
      DB_SYNC: "true"
      DB_DROP: "false"
      JWT_TOKEN_SECRET: dev-secret-change-me
      JWT_TOKEN_EXPIRE_IN: 15m
      JWT_REFRESH_TOKEN_SECRET: dev-refresh-secret-change-me
      JWT_REFRESH_TOKEN_EXPIRE_IN: 7d
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  front:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --silent && npx ng serve --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules

volumes:
  pgdata:
  api_node_modules:
  front_node_modules:
